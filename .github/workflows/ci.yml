name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '26']
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: shiftlands-node-${{ matrix.node }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/
            evidence/
            test-results/
